name: Build portable releases

run-name: >-
  ${{ github.event_name == 'pull_request' && 'PR test build' || 'Portable release' }} ${{ github.event.pull_request.number || (github.ref_type == 'tag' && github.ref_name) || inputs.release_tag || github.ref_name }}

on:
  workflow_call:
    inputs:
      preview:
        description: Build and publish the rolling miaomiao preview
        required: true
        type: boolean
      source_sha:
        description: Exact merged commit to build
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag to create after all builds pass (leave empty to build artifacts only)
        required: false
        type: string
      prerelease:
        description: Mark a manually published release as a pre-release
        required: true
        default: true
        type: boolean
  push:
    branches:
      - preview
    tags:
      - 'v*'
      - 'only-preview'
      - 'preview-*'

concurrency:
  group: portable-${{ github.ref }}-${{ inputs.preview && inputs.source_sha || (github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && github.ref_type == 'branch' && 'cache' || 'release') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  version:
    name: Resolve app version
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'Roomen'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.release_tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MIAOMIAO_PREVIEW: ${{ inputs.preview }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          source_version="$(node scripts/version.mjs)"
          release_tag="$REQUESTED_VERSION"
          event_name="${EVENT_NAME:-${GITHUB_EVENT_NAME:-}}"
          ref_type="${REF_TYPE:-${GITHUB_REF_TYPE:-}}"
          ref_name="${REF_NAME:-${GITHUB_REF_NAME:-}}"

          is_preview_run=false
          if [[ "$event_name" == "push" && "$ref_type" == "branch" && "$ref_name" == "preview" ]]; then
            is_preview_run=true
          elif [[ "$ref_type" == "tag" && "$ref_name" == preview-* ]]; then
            is_preview_run=true
          elif [[ "$release_tag" == preview-* ]]; then
            is_preview_run=true
          fi

          if [[ "$MIAOMIAO_PREVIEW" == "true" ]]; then
            base_version="${source_version%%[-+]*}"
            release_tag="v${base_version}-miaomiao.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            version="$(node scripts/version.mjs "${release_tag#v}")"
          elif [[ "$event_name" == "pull_request" ]]; then
            # Replace any existing prerelease/build suffix for an unambiguous test version.
            base_version="${source_version%%[-+]*}"
            release_tag="v${base_version}-pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            version="$(node scripts/version.mjs "${release_tag#v}")"
          elif [[ "$is_preview_run" == "true" ]]; then
            base_version="${source_version%%[-+]*}"
            preview_stamp="$(node scripts/preview-tag.mjs --stamp)"
            release_tag="preview-${preview_stamp}"
            version="${base_version}-preview.${preview_stamp}"
          elif [ -z "$release_tag" ]; then
            release_tag="v$source_version"
            version="$source_version"
          else
            # Custom release tag supplied
            # If it's a valid semver or v<semver>, parse with scripts/version.mjs
            # If it's a tag like 'only-preview' (not semver), use source_version with preview suffix for binary package version
            tag_version="${release_tag#v}"
            if node scripts/version.mjs "$tag_version" >/dev/null 2>&1; then
              version="$(node scripts/version.mjs "$tag_version")"
              case "$release_tag" in
                v*) ;;
                *) release_tag="v$release_tag" ;;
              esac
            else
              base_version="${source_version%%[-+]*}"
              version="${base_version}-preview.$(date -u +%Y%m%d)-$(date -u +%H%M)"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            display_os: Linux
            arch: amd64
            suffix: tar.gz
          - runner: ubuntu-22.04-arm
            os: linux
            display_os: Linux
            arch: aarch64
            suffix: tar.gz
          - runner: macos-15-intel
            os: darwin
            display_os: Darwin
            arch: amd64
            suffix: dmg
          - runner: macos-15
            os: darwin
            display_os: Darwin
            arch: aarch64
            suffix: dmg
          - runner: windows-2025
            os: windows
            display_os: Windows
            arch: amd64
            suffix: zip
          - runner: windows-11-arm
            os: windows
            display_os: Windows
            arch: aarch64
            suffix: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PACKAGE_RELEASE: ${{ inputs.preview || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'preview') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Restore Bun packages
        id: bun-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ matrix.runner }}-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ matrix.runner }}-1.3.14-
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
          workspaces: src-tauri -> target
          cache-workspace-crates: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Sync bundled core version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_CORE_REPOSITORY: ${{ vars.GITCODE_CORE_REPOSITORY }}
          # Set the CORE_VERSION_PIN repository variable to freeze the bundled kernel
          # for a release, for example while an upstream tag is missing a platform.
          CORE_VERSION_PIN: ${{ vars.CORE_VERSION_PIN }}
        # A release tag builds the kernel pinned in core-version.txt; branch builds
        # keep following the upstream latest release.
        run: node scripts/update-bundled-core.mjs ${{ github.ref_type == 'tag' && '--freeze' || '' }}
      - name: Restore bundled core archive
        id: core-cache
        uses: actions/cache/restore@v5
        with:
          path: cpa-core
          key: core-v2-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('core-version.txt') }}
      - name: Apply release version
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"
      - name: Resolve release package name
        id: package
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "stem=EasyCLIProxyAPI-v${APP_VERSION}-${{ matrix.display_os }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build GUI
        env:
          GITCODE_GUI_REPOSITORY: ${{ vars.GITCODE_GUI_REPOSITORY }}
          GITCODE_CORE_REPOSITORY: ${{ vars.GITCODE_CORE_REPOSITORY }}
        run: |
          bun install --frozen-lockfile
          bun tauri build --no-bundle
        shell: bash
      - name: Prepare portable directory
        run: >-
          node scripts/portable.mjs
          --binary "src-tauri/target/release/cpa-gui${{ matrix.os == 'windows' && '.exe' || '' }}"
          --output "release/${{ steps.package.outputs.stem }}"
          --os "${{ matrix.os }}"
          --arch "${{ matrix.arch }}"
          --download true
        shell: bash
      - name: Save Bun packages
        if: ${{ github.event_name != 'pull_request' && steps.bun-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}
      - name: Save bundled core archive
        if: ${{ github.event_name != 'pull_request' && steps.core-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: cpa-core
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - name: Build signed macOS DMG
        if: env.PACKAGE_RELEASE == 'true' && matrix.os == 'darwin' && github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/apple-signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          keychain_password="$(uuidgen)"
          signed_core_dir="$RUNNER_TEMP/signed-core"
          unsigned_core_archive="$RUNNER_TEMP/unsigned-core-${{ matrix.arch }}.tar.gz"
          core_archive=""
          staging_dir="$RUNNER_TEMP/easycli-dmg-staging"
          bundle_dir="src-tauri/target/release/bundle"
          output_dmg="${{ steps.package.outputs.stem }}.dmg"
          keychain_list="$(security list-keychains -d user)"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychain="${existing_keychain#*\"}"
            existing_keychain="${existing_keychain%\"*}"
            if [ -n "$existing_keychain" ]; then
              existing_keychains+=("$existing_keychain")
            fi
          done <<< "$keychain_list"

          cleanup() {
            set +e
            if [ -n "$core_archive" ] && [ -f "$unsigned_core_archive" ]; then
              cp "$unsigned_core_archive" "$core_archive"
            fi
            rm -f "$certificate_path"
            rm -f "$unsigned_core_archive"
            rm -rf "$signed_core_dir" "$staging_dir"
            security delete-keychain "$keychain_path"
          }
          trap cleanup EXIT

          (umask 077; printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path")
          security create-keychain -p "$keychain_password" "$keychain_path"
          if [ "${#existing_keychains[@]}" -gt 0 ]; then
            security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          else
            security list-keychains -d user -s "$keychain_path"
          fi
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          core_archive="$(find cpa-core -maxdepth 1 -type f -name 'CLIProxyAPI_*_darwin_${{ matrix.arch }}.tar.gz' -print -quit)"
          cp "$core_archive" "$unsigned_core_archive"
          mkdir -p "$signed_core_dir"
          tar -xzf "$core_archive" -C "$signed_core_dir"
          core_binary="$(find "$signed_core_dir" -type f -name 'cli-proxy-api' -print -quit)"
          core_entitlements=".github/entitlements/cli-proxy-api.plist"
          test -s "$core_binary"
          codesign --force --options runtime --timestamp \
            --entitlements "$core_entitlements" \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --keychain "$keychain_path" \
            "$core_binary"
          codesign --verify --strict --verbose=2 "$core_binary"
          signed_team_id="$(codesign -dv "$core_binary" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          test "$signed_team_id" = "$APPLE_TEAM_ID"
          signed_entitlements="$(codesign -d --entitlements :- "$core_binary" 2>&1)"
          grep -q '<key>com.apple.security.cs.disable-library-validation</key>' <<< "$signed_entitlements"
          signed_archive="$RUNNER_TEMP/$(basename "$core_archive")"
          COPYFILE_DISABLE=1 tar -czf "$signed_archive" -C "$signed_core_dir" .
          mv "$signed_archive" "$core_archive"

          cp "release/${{ steps.package.outputs.stem }}/portable-app.json" portable-app.json

          # Build the notarized app with Tauri, then create the DMG with hdiutil.
          # Tauri's generated create-dmg script is unreliable on GitHub's macOS runners.
          env -u APPLE_CERTIFICATE -u APPLE_CERTIFICATE_PASSWORD \
            bun tauri bundle --bundles app --ci --config src-tauri/tauri.dmg.conf.json

          app_path="$bundle_dir/macos/EasyCLIProxyAPI.app"
          resources_dir="$app_path/Contents/Resources"
          test -d "$app_path"
          test ! -e "$app_path/Contents/MacOS/oauth"
          test ! -e "$resources_dir/oauth"
          test -s "$resources_dir/core-version.txt"

          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"
          ditto "$app_path" "$staging_dir/EasyCLIProxyAPI.app"
          ln -s /Applications "$staging_dir/Applications"
          hdiutil create \
            -volname "EasyCLIProxyAPI" \
            -srcfolder "$staging_dir" \
            -format UDZO \
            -ov \
            "$output_dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$keychain_path" "$output_dmg"
          xcrun notarytool submit "$output_dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          # Apple's ticket delivery can briefly fail even after notarization is accepted.
          # Retry stapling and validation independently, without rebuilding or resubmitting the accepted DMG.
          # Each attempt makes a fresh request immediately, with no added delay.
          max_attempts=10000
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if xcrun stapler staple "$output_dmg"; then
              break
            else
              staple_status=$?
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::DMG stapling failed after $attempt attempts (exit $staple_status)."
              exit "$staple_status"
            fi
            echo "::warning::DMG stapling failed (exit $staple_status); requesting again immediately (attempt $((attempt + 1))/$max_attempts)."
          done
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if xcrun stapler validate "$output_dmg"; then
              break
            else
              validate_status=$?
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::DMG validation failed after $attempt attempts (exit $validate_status)."
              exit "$validate_status"
            fi
            echo "::warning::DMG validation failed (exit $validate_status); requesting again immediately (attempt $((attempt + 1))/$max_attempts)."
          done
      - name: Build macOS PR DMG without Apple notarization
        if: github.event_name == 'pull_request' && matrix.os == 'darwin'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          set -euo pipefail
          cp "release/${{ steps.package.outputs.stem }}/portable-app.json" portable-app.json
          bun tauri bundle --bundles app --ci --config src-tauri/tauri.dmg.conf.json
          app_path="src-tauri/target/release/bundle/macos/EasyCLIProxyAPI.app"
          test -d "$app_path"
          staging_dir="$(mktemp -d "$RUNNER_TEMP/easycli-pr-dmg.XXXXXX")"
          trap 'rm -rf "$staging_dir"' EXIT
          ditto "$app_path" "$staging_dir/EasyCLIProxyAPI.app"
          ln -s /Applications "$staging_dir/Applications"
          hdiutil create \
            -volname "EasyCLIProxyAPI" \
            -srcfolder "$staging_dir" \
            -format UDZO \
            -ov \
            "${{ steps.package.outputs.stem }}.dmg"
      - name: Archive Linux release
        if: env.PACKAGE_RELEASE == 'true' && matrix.os == 'linux'
        run: tar -czf "${{ steps.package.outputs.stem }}.tar.gz" -C release "${{ steps.package.outputs.stem }}"
      - name: Archive Windows release
        if: env.PACKAGE_RELEASE == 'true' && matrix.os == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "release/${{ steps.package.outputs.stem }}" -DestinationPath "${{ steps.package.outputs.stem }}.zip"
      - uses: actions/upload-artifact@v7
        id: upload
        if: env.PACKAGE_RELEASE == 'true'
        with:
          name: ${{ steps.package.outputs.stem }}
          path: ${{ steps.package.outputs.stem }}.${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}
      - name: Link PR test package
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PACKAGE_NAME: ${{ steps.package.outputs.stem }}
        run: |
          echo "[Download $PACKAGE_NAME]($ARTIFACT_URL) (GitHub login required; retained for 7 days)." >> "$GITHUB_STEP_SUMMARY"
          echo "PR test build. macOS packages use ad-hoc signing without Apple notarization and may show security warnings." >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: Publish GitHub release
    if: >-
      !inputs.preview && github.event_name != 'pull_request'
      && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' || github.ref == 'refs/heads/preview')
    needs:
      - version
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare shared release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/easycli-release-notes.json" \
            --body-output "$RUNNER_TEMP/easycli-release-notes.md"
      - name: Generate portable update manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! node scripts/version.mjs "${RELEASE_TAG#v}" >/dev/null 2>&1 \
            && [ "$RELEASE_TAG" != "only-preview" ] \
            && [[ "$RELEASE_TAG" != preview-* ]]; then
            echo "Skipping portable update manifests for non-semver release tag: $RELEASE_TAG"
            exit 0
          fi
          for platform in windows linux darwin; do
            node scripts/manifest.mjs \
              --directory artifacts \
              --platform "$platform" \
              --repository "${{ github.repository }}" \
              --gitcode-repository "${{ vars.GITCODE_GUI_REPOSITORY }}" \
              --tag "$RELEASE_TAG" \
              --version "${{ needs.version.outputs.version }}" \
              --release-notes "$RUNNER_TEMP/easycli-release-notes.json"
          done
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          is_unique_preview=false
          if [[ "$RELEASE_TAG" =~ ^preview-[0-9]{8}-[0-9]{4}$ ]]; then
            is_unique_preview=true
          fi

          if node scripts/version.mjs "${RELEASE_TAG#v}" >/dev/null 2>&1; then
            case "$RELEASE_TAG" in
              v*) ;;
              *) RELEASE_TAG="v$RELEASE_TAG" ;;
            esac
          fi

          prerelease="$MANUAL_PRERELEASE"
          release_args=(--title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/easycli-release-notes.md")
          if [[ "$is_unique_preview" == "true" ]]; then
            prerelease=true
            release_args+=(--target "$GITHUB_SHA" --latest=false)
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=true
            elif ! node scripts/version.mjs "${RELEASE_TAG#v}" >/dev/null 2>&1; then
              prerelease=true
            else
              prerelease=false
            fi
          else
            release_args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$prerelease" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if [[ "$GITHUB_REF_TYPE" != "tag" && "$is_unique_preview" != "true" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true 2>/dev/null || true
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
            edit_args=(--title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/easycli-release-notes.md")
            if [[ "$prerelease" == "true" ]]; then
              edit_args+=(--prerelease)
            fi
            if [[ "$is_unique_preview" == "true" ]]; then
              edit_args+=(--latest=false)
            fi
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"

            if [[ "$is_unique_preview" == "true" ]]; then
              gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
                --jq '.assets[] | [.id, .name] | @tsv' 2>/dev/null > "$RUNNER_TEMP/preview-assets.tsv" || true
              if [ -s "$RUNNER_TEMP/preview-assets.tsv" ]; then
                while IFS=$'\t' read -r asset_id asset_name; do
                  if [ ! -f "artifacts/$asset_name" ]; then
                    gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id" || true
                  fi
                done < "$RUNNER_TEMP/preview-assets.tsv"
              fi
            fi
          else
            gh release create "$RELEASE_TAG" "${release_args[@]}" artifacts/*
          fi

          if [[ "$is_unique_preview" == "true" ]]; then
            older_tags="$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null \
              | grep -E '^preview-[0-9]{8}-[0-9]{4}$' \
              | sort -r \
              | tail -n +9 || true)"
            if [ -n "$older_tags" ]; then
              while IFS= read -r old_tag; do
                [ -n "$old_tag" ] || continue
                gh release delete "$old_tag" --cleanup-tag --yes
              done <<< "$older_tags"
            fi
          fi

  publish-preview:
    name: Update rolling miaomiao preview
    if: inputs.preview && github.repository == 'router-for-me/EasyCLIProxyAPI'
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: miaomiao-preview-publication
      cancel-in-progress: false
    steps:
      # Publishing handles artifacts only; it never executes the merged source.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish latest successful branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: miaomiao-preview
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/$GH_REPO/git/ref/heads/miaomiao" --jq '.object.sha')"
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "A newer commit is on miaomiao; skipping this outdated preview." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Check the complete matrix before changing the rolling release.
          packages=()
          for platform in Windows Linux Darwin; do
            case "$platform" in
              Windows) suffix=zip ;;
              Linux) suffix=tar.gz ;;
              Darwin) suffix=dmg ;;
            esac
            for arch in amd64 aarch64; do
              package="artifacts/EasyCLIProxyAPI-v${APP_VERSION}-${platform}-${arch}.${suffix}"
              test -s "$package"
              packages+=("$package")
            done
          done

          notes="$RUNNER_TEMP/miaomiao-preview.md"
          cat > "$notes" <<EOF
          Rolling test build of the miaomiao branch. This preview is replaced after successful builds.

          Version: ${APP_VERSION}
          Commit: https://github.com/${GH_REPO}/commit/${SOURCE_SHA}
          Build: https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}

          Download the package for your system below. macOS packages are signed and notarized.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Distinct versioned filenames keep the previous packages until uploads succeed.
            gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
              -f sha="$SOURCE_SHA" -F force=true
            gh release edit "$RELEASE_TAG" --title 'Miaomiao Preview' \
              --notes-file "$notes" --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" --target "$SOURCE_SHA" \
              --title 'Miaomiao Preview' --notes-file "$notes" --prerelease --latest=false
          fi

          # Keep only this build's assets so the fixed download page stays small.
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | [.id, .name] | @tsv' > "$RUNNER_TEMP/miaomiao-assets.tsv"
          while IFS=$'\t' read -r asset_id asset_name; do
            keep=false
            for package in "${packages[@]}"; do
              if [[ "$asset_name" == "${package#artifacts/}" ]]; then
                keep=true
                break
              fi
            done
            if [[ "$keep" == false ]]; then
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
            fi
          done < "$RUNNER_TEMP/miaomiao-assets.tsv"
          echo "[Download Miaomiao Preview](https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG) — $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
